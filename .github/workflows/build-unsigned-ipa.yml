name: Build unsigned IPA

on:
  push:
    branches: [ci-unsigned-ipa]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Set up Rust for iOS
        run: |
          rustup update stable
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build app (Release, no codesign)
        run: |
          xcodebuild \
            -project GooseSwift.xcodeproj \
            -target GooseSwift \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build/symroot" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/symroot/Release-iphoneos/GooseSwift.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Murmur-unsigned.ipa Payload
          ls -la Murmur-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murmur-unsigned-ipa
          path: Murmur-unsigned.ipa
          retention-days: 30
